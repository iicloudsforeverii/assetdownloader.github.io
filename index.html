<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Roblox file downloader.</title>
    </head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chewy&display=swap');
        .henny-penny-regular {
            font-family: "Henny Penny", system-ui;
            font-weight: 400;
            font-style: normal;
        }
        body {
            display: flex;
            position: relative;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            justify-content: center;
            background-color: #523429;
        }
        .background {
            position: absolute;
            background: url("https://images.unsplash.com/photo-1508255139162-e1f7b7288ab7?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");
            background-size: cover;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: -1;
            margin: 0;
            filter: blur(20px);
        }
        p {
            color: #141517;
            text-align: center;
            font-family: "Chewy", system-ui;
            font-size: 20px;
        }
        input {
            padding: 20px;
            background-color: #523429;
            border: none;
            border-radius: 10px;
            width: 50vw;
            box-sizing: content-box;
            max-width: 300px;
            color: white;
            font-size: 20px;
            font-family: "Chewy", system-ui;
        }
        button {
            padding: 20px;
            background-color: #ac7437;
            border: none;
            border-radius: 10px;
            width: 50vw;
            box-sizing: content-box;
            max-width: 300px;
            color: white;
            font-size: 20px;                  
            font-family: "Chewy", system-ui;     
            transition: transform 0.1s ease;
        }
        button:hover {
            transform: scale(1.02);
        }
        button:active {
            
            transform: scale(0.98);
        }
    </style>
    <body>
        <div class="background"></div>
        <p>Start by putting the link or id in the textbox below, then press the "Download" button.</p>
        <input type="text" name="asset_id" id="asset_id">
        <button id = "button">Download</button>
        <p>Made by jack worhee in like 30 minutes.</p>
    </body>
    <script>
        const button = document.getElementById("button");
        const assetInput = document.getElementById("asset_id");


        button.onclick = function() {
            var input = assetInput.value.replace(/^\D+/g, '');
            window.open(`https://assetdelivery.roblox.com/v1/asset/?id=${input}`,"_blank")
        };
    </script>
</html>
